name: paper
on:
  push:
    paths:
      - 'paper/**'
      - 'results/**'
      - 'tools/check_paper_claims.py'
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: paper claim gate
        run: python3 tools/check_paper_claims.py
